@if (notificationService.message(); as message) {
  <div class="alert alert-danger alert-dismissible position-fixed top-0 start-50 translate-middle-x mt-3"
       style="z-index: 1080;" role="alert">
    {{ message }}
    <button type="button" class="btn-close" (click)="notificationService.clear()" aria-label="Close"></button>
  </div>
}
