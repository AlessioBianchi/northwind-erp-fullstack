<div class="container-fluid p-3">
    <div class="card shadow-sm border-0" style="max-width: 480px;">
        <div class="card-header bg-light border-bottom py-2 px-3">
            <span class="small fw-bold text-secondary text-uppercase">
                <i class="bi bi-key me-1"></i>Change my password
            </span>
        </div>
        <div class="card-body p-3">
            <p class="small text-muted mb-3">Signed in as <strong>{{ username }}</strong></p>

            @if (isSaved) {
                <div class="alert alert-success py-2 small">Password changed.</div>
            }
            @if (validationError) {
                <div class="alert alert-warning py-2 small">{{ validationError }}</div>
            }

            <form class="row g-3" (ngSubmit)="changePassword()">
                <div class="col-12">
                    <label for="currentPassword" class="form-label small fw-semibold text-secondary mb-1">Current password</label>
                    <input id="currentPassword" type="password" class="form-control form-control-sm" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" required>
                </div>
                <div class="col-12">
                    <label for="newPassword" class="form-label small fw-semibold text-secondary mb-1">New password</label>
                    <input id="newPassword" type="password" class="form-control form-control-sm" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="col-12">
                    <label for="confirmPassword" class="form-label small fw-semibold text-secondary mb-1">Confirm new password</label>
                    <input id="confirmPassword" type="password" class="form-control form-control-sm" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                </div>
                <div class="col-12 d-flex justify-content-end border-top pt-3">
                    <button type="submit" class="btn btn-sm btn-primary" [disabled]="isSaving || !currentPassword || !newPassword || !confirmPassword">
                        <i class="bi bi-save me-1"></i>Change password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
